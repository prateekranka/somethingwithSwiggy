<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Cloud Kitchen Level 1</title>
<style>
html,body{margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;background:linear-gradient(#eaf6ff,#fff1d8);color:#26344d}body{min-height:100vh;padding:12px;box-sizing:border-box}.app{max-width:430px;margin:0 auto;background:rgba(255,255,255,.76);border:1px solid rgba(255,255,255,.9);border-radius:28px;padding:14px;box-shadow:0 12px 36px rgba(80,60,30,.16)}h1{margin:4px 0 10px;text-align:center;font-size:28px}.card{background:#fff8ec;border:1px solid #ead6b8;border-radius:20px;padding:12px;margin-bottom:12px;box-shadow:0 6px 16px rgba(80,60,30,.08)}.top{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center;font-weight:800}.big{font-size:36px;line-height:1}.small{color:#6d7890;font-size:13px;margin-top:4px}.message{font-size:15px;line-height:1.35;min-height:42px}.ingredients{display:grid;grid-template-columns:1fr;gap:10px}.ingredient{background:#fff;border:2px solid #ead6b8;border-radius:18px;padding:10px;text-align:left}.ingredient.selected{border-color:#ffbd3f;box-shadow:0 0 0 4px rgba(255,189,63,.22)}.ingredient.ready{border-color:#65b85f;background:#f3ffef}.ingredient-row{display:grid;grid-template-columns:52px 1fr;gap:8px;align-items:center}.emoji{font-size:38px;text-align:center}.name{font-size:18px;font-weight:850}.status{color:#6d7890;font-size:14px;margin-top:2px}.stations{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}button{font:inherit;border:0;border-radius:16px;padding:14px 8px;background:#fff8ec;border:1px solid #ead6b8;color:#26344d;font-weight:850;box-shadow:0 5px 12px rgba(80,60,30,.1);cursor:pointer;touch-action:manipulation}button:active{transform:scale(.97)}.station-btn{min-height:82px}.station-emoji{display:block;font-size:28px;margin-bottom:4px}.green{background:linear-gradient(#91dc86,#5bb663);color:white}.blue{background:linear-gradient(#8fc9f4,#5ea7e3);color:white}.purple{background:linear-gradient(#d2a3f0,#aa75d5);color:white}.serve{width:100%;min-height:64px;font-size:22px;background:linear-gradient(#91dc86,#5bb663);color:white;margin-top:10px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.win{display:none;position:fixed;inset:0;background:rgba(30,40,60,.35);padding:18px;place-items:center}.win.show{display:grid}.winbox{max-width:360px;background:#fff8ec;border-radius:28px;padding:24px;text-align:center;box-shadow:0 20px 70px rgba(0,0,0,.25)}.winbox h2{font-size:30px;margin:8px 0}.stars{font-size:34px;color:#ffbd3f;letter-spacing:2px}.debug{font-size:12px;color:#8992a3;text-align:center;margin-top:12px}
</style>
</head>
<body>
<div class="app"><h1>☁️ Cloud Kitchen</h1><div class="card top"><div><div>Level</div><div class="big">1</div></div><div><div class="big">🍲</div><div class="small">Warm Round Soup</div></div><div><div>Moves</div><div class="big" id="moves">12</div></div></div><div class="card message" id="message">Tap an ingredient, then tap Chop, Steam, and Mix in that order. Make carrot, potato, and broth ready.</div><div class="card"><div class="ingredients"><button class="ingredient" id="carrot" onclick="selectIngredient('carrot')"><div class="ingredient-row"><div class="emoji">🥕</div><div><div class="name">Carrot</div><div class="status" id="carrotStatus">raw</div></div></div></button><button class="ingredient" id="potato" onclick="selectIngredient('potato')"><div class="ingredient-row"><div class="emoji">🥔</div><div><div class="name">Potato</div><div class="status" id="potatoStatus">raw</div></div></div></button><button class="ingredient" id="broth" onclick="selectIngredient('broth')"><div class="ingredient-row"><div class="emoji">🍯</div><div><div class="name">Broth</div><div class="status" id="brothStatus">raw</div></div></div></button><button class="ingredient" id="tomato" onclick="selectIngredient('tomato')"><div class="ingredient-row"><div class="emoji">🍅</div><div><div class="name">Tomato</div><div class="status" id="tomatoStatus">extra / decoy</div></div></div></button></div></div><div class="card"><div class="stations"><button class="station-btn green" onclick="processStation('chopped')"><span class="station-emoji">🔪</span>Chop</button><button class="station-btn blue" onclick="processStation('steamed')"><span class="station-emoji">♨️</span>Steam</button><button class="station-btn purple" onclick="processStation('mixed')"><span class="station-emoji">🥣</span>Mix</button></div><button class="serve" onclick="serveSoup()">🍲 Serve Soup</button><div class="controls"><button onclick="showHint()">💡 Hint</button><button onclick="resetGame()">↻ Reset</button></div></div><div class="debug">Mobile-safe prototype: plain buttons + inline onclick handlers.</div></div><div class="win" id="win"><div class="winbox"><div class="big">🍲</div><h2>Order Complete!</h2><div class="stars" id="stars">★★★</div><p id="winText">The cloud customer loved your soup.</p><button class="serve" onclick="resetGame()">Play Again</button></div></div>
<script>
var selected=null,moves=12,states={carrot:'raw',potato:'raw',broth:'raw',tomato:'extra'},names={carrot:'Carrot',potato:'Potato',broth:'Broth',tomato:'Tomato'};function el(id){return document.getElementById(id)}function msg(text){el('message').innerHTML=text}function vibrate(ms){try{if(navigator.vibrate)navigator.vibrate(ms||20)}catch(e){}}function selectIngredient(id){selected=id;['carrot','potato','broth','tomato'].forEach(function(k){el(k).classList.remove('selected')});el(id).classList.add('selected');msg('Selected <b>'+names[id]+'</b>. Now tap the next station.');vibrate(10)}function updateUI(){el('moves').textContent=moves;['carrot','potato','broth'].forEach(function(id){el(id+'Status').textContent=states[id]==='mixed'?'ready':states[id];if(states[id]==='mixed')el(id).classList.add('ready');else el(id).classList.remove('ready')});el('tomatoStatus').textContent='extra / decoy'}function processStation(nextState){if(!selected){msg('Tap an ingredient first.');vibrate(40);return}if(selected==='tomato'){msg('🍅 Tomato is a decoy for this recipe. Use carrot, potato, and broth.');vibrate(40);return}var current=states[selected];if(nextState==='chopped'&&current!=='raw'){msg(names[selected]+' cannot be chopped now. Follow: <b>Chop → Steam → Mix</b>.');vibrate(40);return}if(nextState==='steamed'&&current!=='chopped'){msg(names[selected]+' must be chopped before steaming.');vibrate(40);return}if(nextState==='mixed'&&current!=='steamed'){msg(names[selected]+' must be steamed before mixing.');vibrate(40);return}if(moves<=0){msg('No moves left. Tap Reset to try again.');vibrate(40);return}states[selected]=nextState;moves-=1;updateUI();var label=nextState==='mixed'?'ready':nextState;msg('✅ '+names[selected]+' is now <b>'+label+'</b>.');if(nextState==='mixed'){el(selected).classList.remove('selected');selected=null}if(isReady())msg('Everything is ready. Tap <b>Serve Soup</b>!');vibrate(15)}function isReady(){return states.carrot==='mixed'&&states.potato==='mixed'&&states.broth==='mixed'}function serveSoup(){if(!isReady()){msg('Not ready yet. Make carrot, potato, and broth ready first.');vibrate(50);return}var stars=moves>=6?'★★★':moves>=3?'★★☆':'★☆☆';el('stars').textContent=stars;el('winText').textContent='You finished with '+moves+' moves left.';el('win').classList.add('show');vibrate(80)}function showHint(){var order=['carrot','potato','broth'];for(var i=0;i<order.length;i++){var id=order[i];if(states[id]!=='mixed'){selectIngredient(id);var next=states[id]==='raw'?'Chop':states[id]==='chopped'?'Steam':'Mix';msg('Hint: <b>'+names[id]+'</b> needs <b>'+next+'</b> next.');return}}msg('Hint: everything is ready. Tap <b>Serve Soup</b>.')}function resetGame(){selected=null;moves=12;states={carrot:'raw',potato:'raw',broth:'raw',tomato:'extra'};['carrot','potato','broth','tomato'].forEach(function(k){el(k).classList.remove('selected');el(k).classList.remove('ready')});el('win').classList.remove('show');updateUI();msg('Tap an ingredient, then tap Chop, Steam, and Mix in that order. Make carrot, potato, and broth ready.')}updateUI();
</script>
</body>
</html>
